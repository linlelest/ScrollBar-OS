name: Build ScrollBar OS

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  SOLUTION_NAME: ScrollBarOS.sln
  PROJECT_PATH: src/ScrollBarOS/ScrollBarOS.csproj
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]
        platform: [x64]

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_NAME }}

    - name: Build
      run: dotnet build ${{ env.SOLUTION_NAME }} --configuration ${{ matrix.configuration }} --platform ${{ matrix.platform }} --no-restore

    - name: Publish (Self-contained)
      run: |
        dotnet publish ${{ env.PROJECT_PATH }} `
          --configuration ${{ matrix.configuration }} `
          --runtime win-${{ matrix.platform }} `
          --self-contained true `
          --output ./publish/ScrollBarOS-win-${{ matrix.platform }} `
          -p:PublishTrimmed=true `
          -p:TrimMode=partial `
          -p:Platform=${{ matrix.platform }}

    - name: Create ZIP archive
      run: |
        Compress-Archive -Path ./publish/ScrollBarOS-win-${{ matrix.platform }}/* -DestinationPath ./ScrollBarOS-win-${{ matrix.platform }}.zip

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScrollBarOS-win-${{ matrix.platform }}
        path: ./ScrollBarOS-win-${{ matrix.platform }}.zip
        retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./artifacts/**/*.zip
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
